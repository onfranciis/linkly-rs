name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkly_rs
  REDIS_URL: redis://localhost:6379
  ROCKET_PORT: 8000

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkly_rs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # sqlx's query_as! macros validate against a live schema at compile
      # time, so the table must exist before `cargo build`/`cargo clippy`.
      # This mirrors the CREATE TABLE in src/util/other.rs.
      - name: Bootstrap database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d linkly_rs -c "
          CREATE TABLE IF NOT EXISTS url (
              id SERIAL PRIMARY KEY,
              short VARCHAR(10) NOT NULL UNIQUE,
              long VARCHAR(255) NOT NULL UNIQUE,
              date VARCHAR(255) NOT NULL
          )"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --verbose
